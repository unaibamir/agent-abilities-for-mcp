name: Set up PHP + Composer
description: >
  Set up PHP and (unless install-composer is false) restore the dev-scoped Composer
  cache and run a clean composer install. Every job in test.yml used to hand-roll
  this same sequence; keeping one copy means the caching strategy documented here
  only needs to be right once. A local composite action is resolved from the
  checked-out repo, so the calling job must run actions/checkout itself before this
  step - this action starts at "Set up PHP".
inputs:
  php-version:
    description: PHP version to set up.
    required: true
  tools:
    description: Extra tools for shivammathur/setup-php's `tools` input.
    required: false
    default: ''
  extensions:
    description: PHP extensions for shivammathur/setup-php's `extensions` input.
    required: false
    default: ''
  install-composer:
    description: >
      Whether to restore the Composer cache and run `composer install`. Set to
      'false' for jobs that do not need the dependency tree (i18n, the PHP 7.4
      parse check against the shipped git-archive export).
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.extensions }}
        coverage: none
        tools: ${{ inputs.tools }}

    # Ask Composer where its download cache lives rather than hardcoding ~/.cache/composer,
    # which is only correct until something sets COMPOSER_HOME or COMPOSER_CACHE_DIR.
    - name: Resolve the Composer cache directory
      if: ${{ inputs.install-composer == 'true' }}
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    # Restore Composer's download cache so these jobs stop re-fetching every dependency from
    # codeload on every run. Dropping ramsey/composer-install to get past the missing-Composer
    # fault also dropped its caching, and the runs that followed tripped GitHub's rate limit -
    # every error was HTTP 429 from codeload.github.com, on jobs that had nothing to do with
    # each other. This is the replacement.
    #
    # The key carries the PHP version so the phpunit matrix legs do not fight over one entry,
    # and a dev/no-dev scope because plugin-check.yml installs with --no-dev: cache entries are
    # immutable, so if that job won the race under a shared key, every dev job would restore a
    # cache with no dev packages in it and re-download them forever.
    - name: Cache Composer downloads
      if: ${{ inputs.install-composer == 'true' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        # A lock change degrades to the newest cache for the same scope and PHP version. The
        # second fallback borrows another PHP leg's cache, which is safe because composer.lock
        # pins one package set and dist archives do not vary by PHP version - that is what warms
        # a cold matrix instead of running twelve simultaneous cold downloads.
        key: ${{ runner.os }}-composer-dev-php${{ inputs.php-version }}-${{ hashFiles('composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-dev-php${{ inputs.php-version }}-
          ${{ runner.os }}-composer-dev-

    - name: Install Composer dependencies
      if: ${{ inputs.install-composer == 'true' }}
      shell: bash
      # Called directly rather than through ramsey/composer-install. setup-php installs Composer
      # and puts it on PATH, but that action resolves it from a fixed tool-cache path that
      # setup-php no longer writes to, so every job that needed dependencies failed on
      # "Unable to find Composer at /opt/hostedtoolcache/setup-php/tools/composer". Both actions
      # were already pinned to their newest releases, so there was no version to bump to.
      # vendor/ is committed for distribution, and its committed composer/installed.json lists the
      # dev packages too, while their directories are not tracked. A plain install therefore trusts
      # that state, skips downloading phpstan and friends, and then dies generating an autoloader
      # that requires vendor/phpstan/phpstan/bootstrap.php. Discard the stale state and install
      # clean. This only affects the CI checkout; the shipped tree comes from git archive.
      run: |
        rm -rf vendor
        composer install --no-interaction --no-progress
