name: Release

# Publishes a new version to wordpress.org when a "Release X.Y.Z" commit lands on
# main (i.e. when the develop -> main Release PR merges). Merging to main IS the
# release: it tags the version, builds the production zip, deploys to the
# wordpress.org SVN repo, and creates the GitHub Release (notes = the readme
# changelog block for this version).
#
# main is branch-protected, so only an authorized, reviewed merge can trigger a
# release. That branch protection is the gate; there is no separate publish click.
#
# It only fires on a real, prepared release: the plugin header version has no tag
# yet AND readme.txt already carries a changelog block for it. A normal commit or
# a bare version bump does nothing.
#
# Required repo secrets for the SVN step (Settings -> Secrets and variables -> Actions):
#   SVN_USERNAME : your wordpress.org account username (case-sensitive)
#   SVN_PASSWORD : the DEDICATED SVN password from your profile, NOT your
#                  wordpress.org login password. Set/retrieve it at
#                  https://profiles.wordpress.org/me/profile/edit/group/3/?screen=svn-password
# Without SVN_PASSWORD the SVN step is skipped (the tag, zip, and GitHub Release
# still happen), so nothing breaks before the secret is added. The run says so in
# a warning annotation, and the MCP registry publish is held back until a deploy
# actually succeeds, because a registry version cannot be unpublished.
#
# workflow_dispatch is a typed escape hatch for the FIRST launch (1.0.0 is already
# tagged, so the push path would skip it) or a re-deploy: run it and type the
# already-tagged version to ship it by hand.
#
# After the release publishes, a separate mcp-registry job pushes the root
# server.json to the official MCP registry (registry.modelcontextprotocol.io)
# over GitHub OIDC - no stored secret. It is deliberately isolated and allowed
# to fail: a registry outage must never make a shipped wordpress.org release
# look broken.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'First launch / re-deploy: exact already-tagged version to ship (e.g. 1.0.0).'
        required: true
        type: string

permissions: {}

concurrency:
  group: wporg-release
  cancel-in-progress: false

jobs:
  publish:
    name: Tag, build, and publish to wordpress.org
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write   # push the tag and create the GitHub Release
    env:
      SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
      SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
    outputs:
      version: ${{ steps.rel.outputs.version }}
      skip: ${{ steps.rel.outputs.skip }}
      svn: ${{ steps.svn.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Resolve version and changelog
        id: rel
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          HEADER="$(grep -E '^\s*\*\s*Version:' agent-abilities-for-mcp.php | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
            if [ "$VERSION" != "$HEADER" ]; then
              echo "::error::Dispatched version $VERSION does not match the plugin header $HEADER. Refusing to deploy."
              exit 1
            fi
          else
            VERSION="$HEADER"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # A humanized changelog block for this version must already be in readme.txt.
          # This is written by hand in the Release PR; the automation only consumes it.
          if ! grep -qF "= $VERSION =" readme.txt; then
            echo "No changelog block for $VERSION in readme.txt; not a prepared release. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # On a normal push, never re-publish a version that is already tagged.
          # (Use workflow_dispatch to intentionally re-deploy an existing tag.)
          if [ "${{ github.event_name }}" = "push" ] && git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to publish on push."
            # Say so in an annotation as well, but only on a replay. This branch is exactly what a
            # "Re-run failed jobs" click lands on after a run that tagged and deployed before
            # failing, and every step below it is gated on skip != 'true', so without this line
            # the replay finishes green having republished nothing at all. Every ordinary push to
            # main after a release lands here too - the header still reads the shipped version and
            # its changelog block never goes away - and annotating all of those would train the
            # eye to skip the one run this exists for. A re-run repeats the same run at attempt 2
            # or higher; a fresh push always starts at 1.
            if [ "${{ github.run_attempt }}" -gt 1 ]; then
              echo "::notice::Tag $VERSION already exists, so this run republished nothing: no zip, no SVN deploy, no GitHub Release, no registry publish. To re-ship an already-tagged version, run this workflow from the Actions tab and type the version."
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          # Extract this version's block from the readme changelog for the release notes.
          awk -v ver="= $VERSION =" '
            $0=="== Changelog ==" {inlog=1; next}
            inlog && /^== / {exit}
            inlog && $0==ver {cap=1; next}
            cap && /^= [0-9]/ {exit}
            cap {print}
          ' readme.txt | sed '/./,$!d' > release-notes.md
          echo "Release notes:"; cat release-notes.md

      - name: Create and push tag (if missing)
        if: steps.rel.outputs.skip != 'true'
        run: |
          set -euo pipefail
          VERSION="${{ steps.rel.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; reusing it."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$VERSION" -m "$VERSION"
            git push origin "$VERSION"
          fi

      - name: Build versioned zip
        if: steps.rel.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p build
          # git archive reads the tagged commit tree and honors .gitattributes
          # export-ignore, so dev files and dev-only vendor dirs stay out. The
          # runtime vendor (vendor/composer, vendor/wordpress) is committed and ships.
          git archive --format=zip --prefix=agent-abilities-for-mcp/ \
            "${{ steps.rel.outputs.version }}" \
            -o "build/agent-abilities-for-mcp-${{ steps.rel.outputs.version }}.zip"

      - name: Deploy to WordPress.org SVN
        id: svn
        if: ${{ steps.rel.outputs.skip != 'true' && env.SVN_PASSWORD != '' }}
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SLUG: agent-abilities-for-mcp
          VERSION: ${{ steps.rel.outputs.version }}
          ASSETS_DIR: .wordpress-org
        with:
          generate-zip: false

      # The SVN step skips silently when the secret is absent, which is the right behaviour
      # for the tag and the GitHub Release but not something to leave quiet: wordpress.org
      # has not received this version, and the registry publish downstream is irreversible.
      - name: Warn when the SVN deploy did not run
        if: ${{ steps.rel.outputs.skip != 'true' && steps.svn.outcome != 'success' }}
        run: |
          echo "::warning::The wordpress.org SVN deploy did not run (outcome: ${{ steps.svn.outcome }}). Check that SVN_USERNAME and SVN_PASSWORD are still set. The MCP registry publish is held back until wordpress.org actually has this version."

      - name: Create the GitHub Release
        if: steps.rel.outputs.skip != 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.rel.outputs.version }}
          name: ${{ steps.rel.outputs.version }}
          body_path: release-notes.md
          files: build/agent-abilities-for-mcp-${{ steps.rel.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Push server.json to the official MCP registry so the listing tracks every
  # release instead of drifting until someone republishes by hand. Runs only
  # after the release job has fully published (tag, zip, SVN, GitHub Release),
  # so nothing here can affect the wordpress.org deploy. The SVN deploy really
  # has to have run: it skips itself when SVN_PASSWORD is missing, and a
  # registry entry cannot be taken back once published, so publishing off a
  # skipped deploy would leave the registry permanently claiming a version
  # wordpress.org never received. continue-on-error
  # keeps the run green if the registry rejects or is down; the failed job and
  # its annotations stay visible in the run summary. Recovery depends on which
  # way it went. If this job RAN and failed, re-running it is enough. If it was
  # SKIPPED because the publish job failed after the deploy, "Re-run failed
  # jobs" is the wrong lever: the replayed push finds the tag already there and
  # skips everything, so the rerun goes green with nothing republished. Ship it
  # by running this workflow from the Actions tab with the already-tagged
  # version, or publish from a workstation with `mcp-publisher login github` +
  # `mcp-publisher publish`.
  # Note: re-dispatching an already-published version will be refused by the
  # registry as a duplicate - that is expected, not a defect.
  mcp-registry:
    name: Publish to the MCP registry
    needs: publish
    if: ${{ needs.publish.outputs.skip != 'true' && needs.publish.outputs.svn == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      id-token: write   # OIDC login to the registry; no stored secret or PAT
      contents: read
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.version }}
          persist-credentials: false

      - name: Sync server.json to the released version
        run: |
          set -euo pipefail
          VERSION="${{ needs.publish.outputs.version }}"
          MANIFEST="$(jq -r '.version' server.json)"
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::warning::server.json says $MANIFEST but the release is $VERSION; publishing as $VERSION. Bump server.json alongside the other version pins."
          fi
          jq --arg v "$VERSION" '.version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          # Pinned to a release tag plus the sha256 of its linux_amd64 asset, mirroring the
          # commit-pinned `uses:` actions above; the old latest/download URL ran whatever the
          # registry shipped most recently, unverified. The asset name is fixed because the
          # runs-on above fixes the platform. To bump: change both variables together - the
          # hash is the mcp-publisher_linux_amd64.tar.gz line of registry_<ver>_checksums.txt
          # on the release page, and each asset also carries a .sigstore.json bundle if a
          # stronger provenance check is ever wanted.
          MCP_PUBLISHER_VERSION="v1.8.1"
          MCP_PUBLISHER_SHA256="a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to registry.modelcontextprotocol.io
        run: |
          set -euo pipefail
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
