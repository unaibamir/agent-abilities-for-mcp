name: Plugin Check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Default to no permissions; grant the minimum per job.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  plugin-check:
    name: Run Plugin Check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      # Keep the throwaway WordPress install outside the workspace. The plugin
      # is symlinked to the repo root, so a WP install inside the workspace
      # would sit under the symlink target and Plugin Check would recurse the
      # whole core tree. runner.temp is only available in steps, not in a
      # job-level env block, so resolve WP_DIR here.
      - name: Resolve install path
        run: echo "WP_DIR=${{ runner.temp }}/wp-pcp" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: mysqli, zip, gd
          coverage: none
          tools: wp-cli

      # See the note in test.yml's PHPCS job: the direct composer install lost
      # ramsey/composer-install's caching, and the runs after that change died on HTTP 429 from
      # codeload.
      - name: Resolve the Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # Scoped "nodev" because the install below is --no-dev and would otherwise save a cache
          # missing every dev package under a key the dev jobs also use. Cache entries cannot be
          # overwritten, so that would stick. The last fallback reads a dev cache on purpose: it
          # is a superset of what this job needs, so it is a full hit rather than a cold download.
          key: ${{ runner.os }}-composer-nodev-php8.3-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-nodev-php8.3-
            ${{ runner.os }}-composer-nodev-
            ${{ runner.os }}-composer-dev-php8.3-

      # Production dependencies only - this is what ships to wordpress.org.
      - name: Install Composer dependencies
        # See the note in test.yml: ramsey/composer-install looks for Composer in a tool-cache path
        # setup-php no longer writes to, so it cannot find the Composer setup-php just installed.
        # vendor/ is committed and its installed.json lists the dev packages while their
        # directories are not tracked, so a plain install skips downloading them and then dies
        # generating an autoloader that requires files that are not there. Install clean.
        run: |
          rm -rf vendor
          composer install --no-interaction --no-progress --no-dev

      - name: Set up WordPress + Plugin Check
        run: |
          set -euo pipefail
          wp core download --path="$WP_DIR" --version=latest
          wp config create --path="$WP_DIR" --dbname=wordpress_pcp --dbuser=root --dbpass=root --dbhost=127.0.0.1
          wp db create --path="$WP_DIR"
          wp core install --path="$WP_DIR" --url=http://localhost --title=PCP \
            --admin_user=admin --admin_password=admin --admin_email=pcp@example.com --skip-email
          wp plugin install plugin-check --activate --path="$WP_DIR"

      - name: Stage the distributable plugin
        run: |
          set -euo pipefail
          # Check the tree that actually ships to wordpress.org, not the dev
          # repo. rsync reads .distignore as its exclude list (same rules the
          # release deploy applies), so dev-only files such as phpunit.xml.dist
          # and the dotfiles never reach the scan.
          dest="$WP_DIR/wp-content/plugins/agent-abilities-for-mcp"
          mkdir -p "$dest"
          rsync -a --exclude-from="$GITHUB_WORKSPACE/.distignore" \
            "$GITHUB_WORKSPACE/" "$dest/"

      - name: Run Plugin Check
        run: |
          set -euo pipefail
          # vendor (third-party, shipped) and languages (generated) are part of
          # the distribution but not our source to fix, so keep them out of the
          # scan. The dev-only files are already gone via .distignore above.
          wp plugin check agent-abilities-for-mcp --path="$WP_DIR" \
            --format=csv --fields=line,column,type,code,message \
            --exclude-directories=vendor,languages \
            | tee pcp-report.csv
          # Fail only on errors. The single DirectDB warning on the internal,
          # constant-name audit table is an accepted false positive.
          if grep -iqE '(^|,)error(,|$)' pcp-report.csv; then
            echo "::error::Plugin Check reported one or more errors."
            exit 1
          fi
          echo "Plugin Check passed with no errors."
