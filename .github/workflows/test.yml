name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Default to no permissions; grant the minimum per job.
permissions: {}

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # PHP_CodeSniffer against the WordPress Coding Standards ruleset.
  phpcs:
    name: Coding standards (PHPCS)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      - name: Install Composer dependencies
        # Called directly rather than through ramsey/composer-install. setup-php installs Composer
        # and puts it on PATH, but that action resolves it from a fixed tool-cache path that
        # setup-php no longer writes to, so every job that needed dependencies failed on
        # "Unable to find Composer at /opt/hostedtoolcache/setup-php/tools/composer". Both actions
        # were already pinned to their newest releases, so there was no version to bump to.
        run: composer install --no-interaction --no-progress

      - name: Run PHPCS
        id: phpcs
        run: vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml

      - name: Annotate PHPCS results on the PR
        if: ${{ always() && steps.phpcs.outcome == 'failure' }}
        run: cs2pr ./phpcs-report.xml

  # PHPStan static analysis at the level configured in phpstan.neon.dist.
  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: cs2pr

      - name: Install Composer dependencies
        # Called directly rather than through ramsey/composer-install. setup-php installs Composer
        # and puts it on PATH, but that action resolves it from a fixed tool-cache path that
        # setup-php no longer writes to, so every job that needed dependencies failed on
        # "Unable to find Composer at /opt/hostedtoolcache/setup-php/tools/composer". Both actions
        # were already pinned to their newest releases, so there was no version to bump to.
        run: composer install --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=checkstyle | cs2pr

  # The shipped translation template must match the source it was generated from.
  #
  # This exists because it silently did not. The .pot went stale on 2026-06-25 and stayed that
  # way through four releases, missing every string 1.4.2 added, which was most of the plugin's
  # translatable text. Nothing caught it: Plugin Check does not compare the template to the
  # source, so every other gate stayed green while translators were handed an incomplete file.
  # Regenerating was a documented release step that simply got forgotten, which is exactly the
  # kind of step that needs a machine watching it rather than a human remembering it.
  i18n:
    name: Translation template (POT)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: wp-cli

      - name: Regenerate the template and compare
        run: |
          set -euo pipefail
          POT=languages/agent-abilities-for-mcp.pot
          # Same excludes as the documented recipe in LESSONS-LEARNED. Keep these in step with
          # the command in the release docs, or the two will disagree about what ships.
          wp i18n make-pot . /tmp/expected.pot \
            --slug=agent-abilities-for-mcp \
            --exclude=vendor,tests,wp,node_modules,.claude,build,bin,.ddev,scratchpad,.wordpress-org

          # POT-Creation-Date changes on every run by design, so it is not evidence of drift.
          # Everything else is.
          strip() { grep -v '^"POT-Creation-Date:' "$1"; }
          if diff -u <(strip "$POT") <(strip /tmp/expected.pot) > /tmp/pot.diff; then
            echo "Translation template is current."
            exit 0
          fi

          echo "::error::$POT is out of date. Regenerate it and commit the result:"
          echo "::error::  wp i18n make-pot . $POT --slug=agent-abilities-for-mcp --exclude=vendor,tests,wp,node_modules,.claude,build,bin,.ddev,scratchpad,.wordpress-org"
          echo
          echo "First 80 lines of the difference (committed vs regenerated):"
          head -80 /tmp/pot.diff
          exit 1

  # Parse-check the shipped export on a real PHP 7.4 binary. PHPStan's phpVersion setting
  # (phpstan.neon.dist) catches most PHP 8-only syntax at this floor, but not all of it: the
  # nullsafe operator, `mixed`, `never`, a `static` return type, a trailing comma in a parameter
  # list, and a new-in-initializer default value are all missed, and every one is a parse error
  # on 7.4. `git archive` honours export-ignore, so this scans exactly what ships in the zip -
  # including bundled vendor/ code that no PHPUnit run fully loads.
  lint74:
    name: Parse check (PHP 7.4, shipped export)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '7.4'
          coverage: none

      - name: Export the shipped tree and lint every file
        run: |
          set -euo pipefail
          mkdir -p /tmp/shipped
          git archive HEAD | tar -x -C /tmp/shipped

          fail=0
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "$output"
              fail=1
            fi
          done < <(find /tmp/shipped -name '*.php' -print0)

          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more shipped files failed to parse on PHP 7.4."
            exit 1
          fi
          echo "All shipped PHP files parse on PHP 7.4."

  # PHPUnit across the supported PHP (>= 7.4) and WordPress (>= 6.9) range.
  phpunit:
    name: PHP ${{ matrix.php }} · WP ${{ matrix.wp }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        wp: ['6.9', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        # Called directly rather than through ramsey/composer-install. setup-php installs Composer
        # and puts it on PATH, but that action resolves it from a fixed tool-cache path that
        # setup-php no longer writes to, so every job that needed dependencies failed on
        # "Unable to find Composer at /opt/hostedtoolcache/setup-php/tools/composer". Both actions
        # were already pinned to their newest releases, so there was no version to bump to.
        run: composer install --no-interaction --no-progress

      - name: Provision WordPress core + PHPUnit test suite
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y subversion
          WP_VERSION='${{ matrix.wp }}'
          # Resolve "latest" to a concrete version so core and the test suite stay in lockstep.
          if [ "$WP_VERSION" = "latest" ]; then
            WP_VERSION="$(curl -fsSL https://api.wordpress.org/core/version-check/1.7/ \
              | grep -o '"version":"[0-9.]*"' | head -1 | grep -o '[0-9.]*')"
          fi
          if [ "$WP_VERSION" = "trunk" ]; then TAG="trunk"; else TAG="tags/${WP_VERSION}"; fi

          mkdir -p "$WP_CORE_DIR"
          if [ "$WP_VERSION" = "trunk" ]; then
            curl -fsSL https://wordpress.org/nightly-builds/wordpress-latest.zip -o /tmp/wp.zip
            unzip -q /tmp/wp.zip -d /tmp/
            mv /tmp/wordpress/* "$WP_CORE_DIR/"
          else
            curl -fsSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wp.tgz
            tar --strip-components=1 -zxmf /tmp/wp.tgz -C "$WP_CORE_DIR"
          fi

          mkdir -p "$WP_TESTS_DIR"
          svn export --quiet --force "https://develop.svn.wordpress.org/${TAG}/tests/phpunit/includes/" "${WP_TESTS_DIR}/includes"
          svn export --quiet --force "https://develop.svn.wordpress.org/${TAG}/tests/phpunit/data/" "${WP_TESTS_DIR}/data"
          curl -fsSL "https://develop.svn.wordpress.org/${TAG}/wp-tests-config-sample.php" -o "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s/youremptytestdbnamehere/wordpress_test/" "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s/yourusernamehere/root/" "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s/yourpasswordhere/root/" "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s|localhost|127.0.0.1|" "${WP_TESTS_DIR}/wp-tests-config.php"
          sed -i "s:dirname( __FILE__ ) . '/src/':'${WP_CORE_DIR}/':" "${WP_TESTS_DIR}/wp-tests-config.php"

      - name: Create test database
        run: mysqladmin create wordpress_test -uroot -proot -h127.0.0.1 -P3306 || true

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  # Single gating check that fans in the whole suite - this is the context to
  # require in branch protection, so the matrix can change without re-wiring.
  test-result:
    name: Test Suite Result
    needs: [phpcs, phpstan, i18n, lint74, phpunit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.phpcs.result }}" != "success" ] \
            || [ "${{ needs.phpstan.result }}" != "success" ] \
            || [ "${{ needs.i18n.result }}" != "success" ] \
            || [ "${{ needs.lint74.result }}" != "success" ] \
            || [ "${{ needs.phpunit.result }}" != "success" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."
