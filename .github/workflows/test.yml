name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Default to no permissions; grant the minimum per job.
permissions: {}

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  # PHP_CodeSniffer against the WordPress Coding Standards ruleset.
  phpcs:
    name: Coding standards (PHPCS)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP + Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          tools: cs2pr

      - name: Run PHPCS
        id: phpcs
        run: vendor/bin/phpcs --report-full --report-checkstyle=./phpcs-report.xml

      - name: Annotate PHPCS results on the PR
        if: ${{ always() && steps.phpcs.outcome == 'failure' }}
        run: cs2pr ./phpcs-report.xml

  # PHPStan static analysis at the level configured in phpstan.neon.dist.
  phpstan:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP + Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          tools: cs2pr

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=checkstyle | cs2pr

  # The shipped translation template must match the source it was generated from.
  #
  # This exists because it silently did not. The .pot went stale on 2026-06-25 and stayed that
  # way through four releases, missing every string 1.4.2 added, which was most of the plugin's
  # translatable text. Nothing caught it: Plugin Check does not compare the template to the
  # source, so every other gate stayed green while translators were handed an incomplete file.
  # Regenerating was a documented release step that simply got forgotten, which is exactly the
  # kind of step that needs a machine watching it rather than a human remembering it.
  i18n:
    name: Translation template (POT)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.3'
          tools: wp-cli
          install-composer: 'false'

      - name: Regenerate the template and compare
        run: |
          set -euo pipefail
          POT=languages/agent-abilities-for-mcp.pot
          # Same excludes as the documented recipe in LESSONS-LEARNED. Keep these in step with
          # the command in the release docs, or the two will disagree about what ships.
          wp i18n make-pot . /tmp/expected.pot \
            --slug=agent-abilities-for-mcp \
            --exclude=vendor,tests,wp,node_modules,.claude,build,bin,.ddev,scratchpad,.wordpress-org

          # POT-Creation-Date changes on every run by design, so it is not evidence of drift.
          # Everything else is.
          strip() { grep -v '^"POT-Creation-Date:' "$1"; }
          if diff -u <(strip "$POT") <(strip /tmp/expected.pot) > /tmp/pot.diff; then
            echo "Translation template is current."
            exit 0
          fi

          echo "::error::$POT is out of date. Regenerate it and commit the result:"
          echo "::error::  wp i18n make-pot . $POT --slug=agent-abilities-for-mcp --exclude=vendor,tests,wp,node_modules,.claude,build,bin,.ddev,scratchpad,.wordpress-org"
          echo
          echo "First 80 lines of the difference (committed vs regenerated):"
          head -80 /tmp/pot.diff
          exit 1

  # Parse-check the shipped export on a real PHP 7.4 binary. PHPStan's phpVersion setting
  # (phpstan.neon.dist) catches most PHP 8-only syntax at this floor, but not all of it: the
  # nullsafe operator, `mixed`, `never`, a `static` return type, a trailing comma in a parameter
  # list, and a new-in-initializer default value are all missed, and every one is a parse error
  # on 7.4. `git archive` honours export-ignore, so this scans exactly what ships in the zip -
  # including bundled vendor/ code that no PHPUnit run fully loads.
  lint74:
    name: Parse check (PHP 7.4, shipped export)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '7.4'
          install-composer: 'false'

      - name: Export the shipped tree and lint every file
        run: |
          set -euo pipefail
          mkdir -p /tmp/shipped
          git archive HEAD | tar -x -C /tmp/shipped

          fail=0
          while IFS= read -r -d '' file; do
            if ! output=$(php -l "$file" 2>&1); then
              echo "$output"
              fail=1
            fi
          done < <(find /tmp/shipped -name '*.php' -print0)

          if [ "$fail" -ne 0 ]; then
            echo "::error::One or more shipped files failed to parse on PHP 7.4."
            exit 1
          fi
          echo "All shipped PHP files parse on PHP 7.4."

      # Parsing is not loading. `php -l` never executes a require, so a shipped
      # autoloader pointing at packages that do not ship lints perfectly clean and
      # still fatals the moment WordPress activates the plugin. That happened once:
      # a dev-regenerated vendor/composer was committed by accident and every gate,
      # including this job, stayed green over a zip that was dead on arrival.
      #
      # The require is the load-bearing assertion, proved in both directions against
      # a real broken export and a real good one. The class_exists check below is
      # DEFENSIVE, not demonstrated load-bearing: hollowing the PSR-4 map still left
      # the adapter resolvable through the classmap, so no mutant has yet made it the
      # only thing that fires. It is kept because it costs nothing and pins the
      # autoloader to a class that must exist, not because anything depends on it.
      - name: Load the shipped autoloader
        run: |
          set -euo pipefail
          if ! output=$(php -r 'require "/tmp/shipped/vendor/autoload.php";' 2>&1); then
            echo "$output"
            echo "::error::The shipped autoloader does not load. The zip would fatal on activation."
            echo "::error::Most likely vendor/composer was regenerated with dev dependencies and committed."
            echo "::error::Fix with: composer install --no-dev && composer dump-autoload --no-dev"
            exit 1
          fi
          php -r '
            require "/tmp/shipped/vendor/autoload.php";
            if ( ! class_exists( "WP\\MCP\\Core\\McpAdapter" ) ) {
                fwrite( STDERR, "McpAdapter did not resolve from the shipped autoloader.\n" );
                exit( 1 );
            }
            echo "Shipped autoloader loads and resolves the adapter.\n";
          '

  # PHPUnit across the supported PHP (>= 7.4) and WordPress (>= 6.9) range.
  phpunit:
    name: PHP ${{ matrix.php }} · WP ${{ matrix.wp }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
        wp: ['6.9', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP + Composer
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, zip, gd
          tools: composer:v2

      - name: Provision WordPress core + PHPUnit test suite
        run: |
          set -euo pipefail
          # The runner's default mirror (azure.archive.ubuntu.com) intermittently stalls, and
          # apt keeps retrying it until the job hits timeout-minutes. It cost three runs in one
          # day, each dying at exactly 20 minutes on this line with no other symptom. Point apt
          # at the canonical mirror, which stays responsive when azure does not, and cap the
          # update so a bad mirror costs seconds instead of the whole run. The update is allowed
          # to fail: the install is what has to succeed, and it is the step that reports.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo timeout 180 apt-get update -o Acquire::Retries=2 || true
          sudo apt-get install -y --no-install-recommends subversion
          # Same script a local `ddev exec bin/install-wp-tests.sh` run uses, so this leg and a
          # local run can never silently diverge. It also creates the test database itself.
          bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 '${{ matrix.wp }}'

      - name: Run PHPUnit
        run: vendor/bin/phpunit

  # Single gating check that fans in the whole suite - this is the context to
  # require in branch protection, so the matrix can change without re-wiring.
  test-result:
    name: Test Suite Result
    needs: [phpcs, phpstan, i18n, lint74, phpunit]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ needs.phpcs.result }}" != "success" ] \
            || [ "${{ needs.phpstan.result }}" != "success" ] \
            || [ "${{ needs.i18n.result }}" != "success" ] \
            || [ "${{ needs.lint74.result }}" != "success" ] \
            || [ "${{ needs.phpunit.result }}" != "success" ]; then
            echo "One or more required checks failed."
            exit 1
          fi
          echo "All required checks passed."
